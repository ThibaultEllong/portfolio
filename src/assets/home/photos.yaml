# Photos shown in the home page ring. The ring shuffles them into a new random order on every
# visit; this order is only used if JavaScript is off.
# Each photo: the file, a title shown under the front photo, an alt text describing
# the photo for screen readers, and an optional location and date, shown under the title
# (left empty, they show nothing). Any text can be the same in French and English, or given
# in each language as { fr: ..., en: ... }; text with a comma goes in quotes. The date is a
# year (2026), a month (2026-08) or a day (2026-10-17), shown as "2026", "août 2026" /
# "August 2026", "17 octobre 2026". E.g.:
#
#   - src: ./my-photo.jpg
#     title: { fr: Titre sous la photo, en: Title under the photo }
#     alt: What the photo shows
#     location: { fr: Norvège, en: Norway }
#     date: 2026-08

