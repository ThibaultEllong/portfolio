# Photos shown in the home page ring. The ring shuffles them into a new random order on every
# visit; this order is only used if JavaScript is off.
# Each photo: the file, a title shown under the front photo, an alt text describing
# the photo for screen readers, and an optional location and year. Any text can be the same
# in French and English, or given in each language as { fr: ..., en: ... }, e.g.:
#
#   - src: ./my-photo.jpg
#     title: { fr: Titre sous la photo, en: Title under the photo }
#     alt: What the photo shows
#     location: City, Country
#     year: 2026

